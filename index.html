<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Night Memo Login</title>
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="dns-prefetch" href="//esm.sh">
  <link rel="preconnect" href="https://csibbrzbljemusyzpzmo.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="//csibbrzbljemusyzpzmo.supabase.co">
  <link rel="stylesheet" href="./css/legacy-shell.css">
  <link rel="stylesheet" href="./css/login.css">
</head>
<body class="legacy-page login-page">
  <main class="legacy-shell login-shell">
    <header class="legacy-window-title">
      <div>
        <div class="legacy-title-text">Night Memo</div>
        <div class="legacy-subtitle">Hospital ward night reporting system</div>
      </div>
      <div class="legacy-spacer"></div>
      <div id="modeBadge"></div>
    </header>

    <section class="main-panel login-main-panel">
      <section class="login-role-chooser" id="loginIntro" aria-labelledby="loginIntroTitle">
        <div class="login-intro-copy">
          <h1 id="loginIntroTitle">Select Login</h1>
          <p>Choose your workspace to continue.</p>
        </div>

        <div class="login-role-grid" aria-label="Login type">
          <button type="button" class="login-option login-role-card" data-role="ward">
            <span class="login-role-icon" aria-hidden="true">
              <svg viewBox="0 0 64 64" role="img">
                <path d="M17 55V16h30v39M24 55V43h16v12M12 55h40"/>
                <path d="M28 24h8M32 20v8M23 33h5M36 33h5"/>
              </svg>
            </span>
            <span class="login-role-title">Ward</span>
            <span class="login-role-description">Ward Night Memo entry</span>
          </button>

          <button type="button" class="login-option login-role-card" data-role="manager">
            <span class="login-role-icon" aria-hidden="true">
              <svg viewBox="0 0 64 64" role="img">
                <path d="M20 12h24v43H20zM27 9h10a3 3 0 0 1 3 3v4H24v-4a3 3 0 0 1 3-3z"/>
                <path d="M26 27h12M26 35h12M26 43h8"/>
              </svg>
            </span>
            <span class="login-role-title">Patrol Night</span>
            <span class="login-role-description">Night operations and memo</span>
          </button>

          <button type="button" class="login-option login-role-card" data-role="maintenance">
            <span class="login-role-icon" aria-hidden="true">
              <svg viewBox="0 0 64 64" role="img">
                <path d="M38 15a12 12 0 0 0-14 15L11 43a5 5 0 0 0 7 7l13-13a12 12 0 0 0 15-14l-7 7-7-2-2-7z"/>
              </svg>
            </span>
            <span class="login-role-title">Maintenance</span>
            <span class="login-role-description">System configuration</span>
          </button>
        </div>
      </section>

      <section class="login-box" id="loginBox" aria-labelledby="loginTitle">
        <div class="login-form-heading">
          <h1 id="loginTitle">Login</h1>
          <p id="loginRolePrompt">Enter your account credentials.</p>
        </div>

        <form id="loginForm">
          <div class="login-form-row">
            <label id="loginIdLabel" for="loginId">Account</label>
            <input id="loginId" type="email" autocomplete="username" required>
          </div>

          <div class="login-form-row">
            <label for="password">Password</label>
            <div class="password-control">
              <input id="password" type="password" autocomplete="current-password" required>
              <button type="button" class="password-visibility-button" id="togglePassword" aria-controls="password" aria-pressed="false" aria-label="Show password" title="Show password">
                <svg class="password-eye password-eye-show" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/>
                  <circle cx="12" cy="12" r="2.8"/>
                </svg>
                <svg class="password-eye password-eye-hide" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 3l18 18M9.7 6.3A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16.8 16.8 0 0 1-3.1 3.7M6.1 7.2C3.8 9.1 2.5 12 2.5 12s3.5 6 9.5 6c1.4 0 2.7-.3 3.8-.7M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="status-note login-demo hidden" id="demoHint"></div>
          <div class="login-actions">
            <button type="button" class="pill" id="backBtn">Back</button>
            <button type="submit" class="pill" id="loginBtn">Login</button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script type="module" src="./login.js"></script>
</body>
</html>
